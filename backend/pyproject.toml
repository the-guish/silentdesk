[project]
name = "silentdesk"
version = "0.1.0"
description = "SilentDesk's sources and sync logic, run by the desktop app as a child process"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    # Trust the operating system's certificate store, like the rest of the
    # app, so corporate TLS inspection keeps working.
    "truststore>=0.10",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

# The app runs `python -m silentdesk` from this folder; nothing is installed.
[tool.uv]
package = false
