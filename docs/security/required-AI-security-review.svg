<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">AI security review of a pull request</title>
  <desc id="desc">A ready pull request runs the tests. When they pass, Claude Haiku screens the diff. A diff that touches security gets a deep review by Claude Fable; any other diff gets a standard review by Claude Opus. After all other checks finish, Cursor Security Reviewer reviews the pull request. A person reads both reviews and decides on the merge.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
      .claude { fill: #fbf3ee; stroke: #c4673f; stroke-width: 1.5; }
      .deep { fill: #f6e3d8; stroke: #c4673f; stroke-width: 2.5; }
      .cursor { fill: #f0f2f5; stroke: #424a53; stroke-width: 1.5; }
      .human { fill: #ffffff; stroke: #1f2328; stroke-width: 2; }
      .t { font-size: 15px; font-weight: 600; fill: #1f2328; }
      .s { font-size: 12.5px; fill: #57606a; }
      .lane { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; fill: #6e7781; }
      .edge { stroke: #57606a; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .label { font-size: 12px; fill: #57606a; font-style: italic; }
    </style>
  </defs>

  <rect width="880" height="520" fill="#ffffff"/>

  <!-- Lanes -->
  <text class="lane" x="24" y="34">GITHUB ACTIONS · CI</text>
  <line x1="24" y1="44" x2="856" y2="44" stroke="#d0d7de"/>
  <text class="lane" x="24" y="384">CURSOR · SECURITY AGENTS</text>
  <line x1="24" y1="394" x2="856" y2="394" stroke="#d0d7de"/>

  <!-- Pull request -->
  <rect class="box" x="24" y="160" width="132" height="64" rx="8"/>
  <text class="t" x="90" y="188" text-anchor="middle">Pull request</text>
  <text class="s" x="90" y="208" text-anchor="middle">ready for review</text>

  <!-- Tests -->
  <rect class="box" x="196" y="160" width="140" height="64" rx="8"/>
  <text class="t" x="266" y="188" text-anchor="middle">Tests</text>
  <text class="s" x="266" y="208" text-anchor="middle">5 deterministic jobs</text>

  <!-- Screening -->
  <rect class="claude" x="376" y="152" width="152" height="80" rx="8"/>
  <text class="s" x="452" y="176" text-anchor="middle">Stage 1 · screening</text>
  <text class="t" x="452" y="198" text-anchor="middle">Claude Haiku 5.5</text>
  <text class="s" x="452" y="218" text-anchor="middle">low effort · yes / no</text>

  <!-- Deep review -->
  <rect class="deep" x="576" y="64" width="176" height="84" rx="8"/>
  <text class="s" x="664" y="88" text-anchor="middle">Stage 2 · deep review</text>
  <text class="t" x="664" y="110" text-anchor="middle">Claude Fable 5.1</text>
  <text class="s" x="664" y="130" text-anchor="middle">extra-high effort</text>

  <!-- Standard review -->
  <rect class="claude" x="576" y="236" width="176" height="84" rx="8"/>
  <text class="s" x="664" y="260" text-anchor="middle">Stage 2 · standard review</text>
  <text class="t" x="664" y="282" text-anchor="middle">Claude Opus 5.5</text>
  <text class="s" x="664" y="302" text-anchor="middle">medium effort</text>

  <!-- Cursor Security Reviewer -->
  <rect class="cursor" x="376" y="414" width="376" height="64" rx="8"/>
  <text class="t" x="564" y="442" text-anchor="middle">Cursor Security Reviewer</text>
  <text class="s" x="564" y="462" text-anchor="middle">exploitable issues only, validated before it comments</text>

  <!-- Human -->
  <rect class="human" x="784" y="160" width="80" height="64" rx="8"/>
  <text class="t" x="824" y="188" text-anchor="middle">Person</text>
  <text class="s" x="824" y="208" text-anchor="middle">merges</text>

  <!-- Edges -->
  <path class="edge" d="M156,192 H192"/>
  <path class="edge" d="M336,192 H372"/>
  <path class="edge" d="M528,180 C552,180 552,106 572,106"/>
  <text class="label" x="548" y="138" text-anchor="end">touches security</text>
  <path class="edge" d="M528,204 C552,204 552,278 572,278"/>
  <text class="label" x="548" y="256" text-anchor="end">does not</text>
  <path class="edge" d="M752,106 C776,106 770,176 780,180"/>
  <path class="edge" d="M752,278 C776,278 770,208 780,204"/>
  <path class="edge" d="M664,320 V410"/>
  <text class="label" x="672" y="372">after all other checks</text>
  <path class="edge" d="M752,446 H824 V228"/>
  <text class="label" x="790" y="440" text-anchor="middle">comments</text>
</svg>
