[project]
name = "silentdesk-gtk"
version = "0.1.0"
description = "SilentDesk for Linux, with GTK4 and libadwaita"
license = "MIT"
authors = [{ name = "The SilentDesk Authors" }]
requires-python = ">=3.12"
# PyGObject, GTK and libadwaita come from the system packages (see README.md).
dependencies = ["silentdesk"]

[project.gui-scripts]
silentdesk-gtk = "silentdesk_gtk.app:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv.sources]
silentdesk = { path = "../core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
