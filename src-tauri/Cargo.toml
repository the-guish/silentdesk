[package]
name = "silentdesk"
version = "0.1.0"
description = "SilentDesk, a desktop work task tracker"
authors = ["The SilentDesk Authors"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "silentdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4.2.0"
chacha20poly1305 = "0.11.0"
tokio = { version = "1.54.1", features = ["process", "time", "io-util", "macros", "rt", "sync"] }
tauri-plugin-opener = "2.7.2"
thiserror = "2.0.21"
getrandom = "0.4.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
