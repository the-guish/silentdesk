name: Apple app

# Every push that touches the Apple code builds SilentDesk.app, so any branch
# has an app to download and try, and screenshots of its screens.
on:
  push:
    paths:
      - apple/**
      - .github/workflows/apple-app.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-linux:
    name: Apple app model (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install SQLCipher and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev libssl-dev
      - run: swift --version
      - name: Unit tests
        run: swift test --package-path apple/app

  macos:
    name: Apple app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: swift --version
      # The SwiftUI app, which only builds on macOS.
      - name: Build
        run: swift build --package-path apple/app
      # Temporary: shows where the app module's compile puts its outputs.
      - name: Diagnose the build
        if: failure()
        working-directory: apple/app
        run: |
          head -c 3000 .build/arm64-apple-macosx/debug/SilentDesk.build/output-file-map.json; echo
          cat .build/arm64-apple-macosx/debug/SilentDesk.build/sources
          ls -la . Sources/SilentDesk .build/arm64-apple-macosx/debug/SilentDesk.build
          find . -name 'QueueView*' -not -path './Sources/*'
      - name: Unit tests
        run: swift test --package-path apple/app

  macos:
    name: Apple app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: swift --version
      # The SwiftUI app, which only builds on macOS.
      - name: Build
        run: swift build --package-path apple/app
      # Temporary: re-runs the app module's compile verbatim, to see its output.
      - name: Diagnose the build
        if: failure()
        working-directory: apple/app
        run: |
          swift build -v > "$RUNNER_TEMP/build.log" 2>&1 || true
          grep -n -E 'swift-frontend|swiftc' "$RUNNER_TEMP/build.log" | grep -- '-module-name SilentDesk ' | cut -c1-600
          cmd=$(grep -E -- '-module-name SilentDesk ' "$RUNNER_TEMP/build.log" | grep -v -- '-emit-module-path' | head -1 || true)
          [ -z "$cmd" ] && cmd=$(grep -E -- '-module-name SilentDesk ' "$RUNNER_TEMP/build.log" | head -1)
          echo "--- running: ${cmd:0:400}"
          set +e
          eval "$cmd"
          echo "exit $?"
          tail -40 "$RUNNER_TEMP/build.log"
      - name: Unit tests
        run: swift test --package-path apple/app
      - name: Build SilentDesk.app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: apple/app/Scripts/bundle.sh "$RUNNER_TEMP/SilentDesk.app"
      # ditto keeps the bundle's symlinks, permissions and signature, which
      # the artifact's own zip would lose.
      - name: Zip the app
        run: ditto -c -k --keepParent "$RUNNER_TEMP/SilentDesk.app" "$RUNNER_TEMP/SilentDesk.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SilentDesk-macOS
          path: ${{ runner.temp }}/SilentDesk.zip
          if-no-files-found: error
      - name: Screenshots
        timeout-minutes: 5
        run: |
          "$RUNNER_TEMP/SilentDesk.app/Contents/MacOS/SilentDesk" --screenshots "$RUNNER_TEMP/screenshots"
          sips -s format png "$RUNNER_TEMP/SilentDesk.app/Contents/Resources/AppIcon.icns" --out "$RUNNER_TEMP/screenshots/0-icon.png"
          ls -l "$RUNNER_TEMP/screenshots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
