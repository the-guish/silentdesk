name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review starts the security review when a draft becomes ready.
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  spec:
    name: Conformance runner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: |
          uvx ruff check spec/runner
          uvx ruff format --check spec/runner
      - name: Test
        run: uv run --no-project --with pytest --with 'jsonschema>=4.23' pytest -q spec/runner/tests

  linux-core:
    name: Linux core (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --directory linux/core --locked
      - name: Lint
        run: |
          uv run --directory linux/core ruff check
          uv run --directory linux/core ruff format --check
      - name: Import rules
        run: uv run --directory linux/core lint-imports
      - name: Unit tests
        run: uv run --directory linux/core pytest -q
      # The CLI runs under coverage. Its report is the one SonarQube Cloud reads.
      - name: Conformance
        env:
          COVERAGE_RCFILE: ${{ github.workspace }}/linux/core/pyproject.toml
          COVERAGE_FILE: ${{ github.workspace }}/linux/core/.coverage
        run: uv run spec/runner/conformance.py --pending linux/core/conformance-pending.txt -- linux/core/.venv/bin/coverage run -m silentdesk
      # Paths in the report start at linux/, the SonarQube Cloud project's folder.
      - name: Coverage report
        working-directory: linux
        env:
          COVERAGE_RCFILE: ${{ github.workspace }}/linux/core/pyproject.toml
          COVERAGE_FILE: ${{ github.workspace }}/linux/core/.coverage
        run: |
          core/.venv/bin/coverage combine
          core/.venv/bin/coverage xml -o core/coverage.xml
      - uses: actions/upload-artifact@v4
        with:
          name: linux-core-coverage
          path: linux/core/coverage.xml

  linux-gtk:
    name: Linux app (GTK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install GTK, libadwaita and PyGObject
        run: |
          sudo apt-get update
          sudo apt-get install -y gir1.2-adw-1 gir1.2-gtk-4.0 python3-gi xvfb
      - name: Create the environment on the system Python
        run: |
          uv venv --directory linux/gtk --python /usr/bin/python3 --system-site-packages
          uv sync --directory linux/gtk --locked
      - name: Lint
        run: |
          uv run --directory linux/gtk ruff check
          uv run --directory linux/gtk ruff format --check
      - name: Tests
        run: xvfb-run -a uv run --directory linux/gtk pytest -q

  apple-core:
    name: Apple core (Swift, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux keeps the core portable; macOS is the platform it ships on.
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install SQLCipher and OpenSSL
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev libssl-dev
      - run: swift --version
      - run: swift build --package-path apple/core
      - name: Unit tests
        run: swift test --package-path apple/core
      - name: Conformance
        run: uv run spec/runner/conformance.py --pending apple/core/conformance-pending.txt -- apple/core/.build/debug/silentdesk

  tests:
    name: Tests
    # One check that passes only when every test job passed.
    needs: [spec, linux-core, linux-gtk, apple-core]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check the test jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  # Which platforms changed, so each SonarQube Cloud project is scanned only when its folder changes.
  # A change to this workflow scans both.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      linux: ${{ steps.filter.outputs.linux == 'true' || steps.filter.outputs.ci == 'true' }}
      apple: ${{ steps.filter.outputs.apple == 'true' || steps.filter.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ci:
              - .github/workflows/ci.yml
            linux:
              - linux/**
              # The conformance cases set the core's coverage.
              - spec/**
            apple:
              - apple/**

  # One SonarQube Cloud project per platform. Pull requests from forks get no secrets, so they skip the scans.
  sonar-linux:
    name: SonarQube Cloud (Linux)
    needs: [changes, linux-core]
    if: >-
      needs.changes.outputs.linux == 'true' && (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarQube Cloud reads the history to find new code.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: linux-core-coverage
          path: linux/core
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: linux
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sonar-apple:
    name: SonarQube Cloud (Apple)
    needs: changes
    if: >-
      needs.changes.outputs.apple == 'true' && (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: apple
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security-screening:
    name: Claude security screening
    needs: tests
    # Ready pull requests from this repository only: forks get no secrets, and Claude trusts the code it reads.
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      touches_security: ${{ fromJSON(steps.screen.outputs.structured_output).touches_security }}
    steps:
      # The merge commit, so branches from before the prompt files still have them.
      - uses: actions/checkout@v4
      - id: prompt
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'text<<END_OF_PROMPT'
            envsubst '$REPO $PR_NUMBER' < .github/prompts/security-screening.md
            echo 'END_OF_PROMPT'
          } >> "$GITHUB_OUTPUT"
      # v1.0.262
      - id: screen
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model claude-haiku-5-5
            --effort low
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","properties":{"touches_security":{"type":"boolean"}},"required":["touches_security"]}'

  security-review:
    name: Claude security review
    needs: security-screening
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      # Signs in as the Claude GitHub app, so the comments carry its name and logo.
      id-token: write
    env:
      DEPTH: ${{ needs.security-screening.outputs.touches_security == 'true' && 'Deep' || 'Standard' }}
      MODEL: ${{ needs.security-screening.outputs.touches_security == 'true' && 'claude-fable-5-1' || 'claude-opus-5-5' }}
      EFFORT: ${{ needs.security-screening.outputs.touches_security == 'true' && 'xhigh' || 'medium' }}
    steps:
      # The merge commit, so branches from before the prompt files still have them.
      - uses: actions/checkout@v4
      - id: prompt
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo 'text<<END_OF_PROMPT'
            envsubst '$REPO $PR_NUMBER $HEAD_SHA $DEPTH $MODEL $EFFORT' < .github/prompts/security-review.md
            echo 'END_OF_PROMPT'
          } >> "$GITHUB_OUTPUT"
      # The Claude app acts only from workflows identical to the default branch's.
      # When the checked-out workflows, prompts or Claude instruction files differ from it,
      # or the check fails, the review posts with the workflow token instead.
      - id: token
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$DEFAULT_BRANCH"
          if ! git diff --quiet FETCH_HEAD -- .github/workflows .github/prompts \
              ':(glob)**/CLAUDE.md' ':(glob)**/CLAUDE.local.md' ':(glob)**/AGENTS.md' \
              ':(glob)**/.claude/**' ':(glob)**/.mcp.json'; then
            echo "changes_ci=true" >> "$GITHUB_OUTPUT"
          fi
      # v1.0.262
      - uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.token.outputs.changes_ci == 'true' && github.token || '' }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model ${{ env.MODEL }}
            --effort ${{ env.EFFORT }}
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment ${{ github.event.pull_request.number }}:*)"
