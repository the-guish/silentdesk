name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    name: Conformance runner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: |
          uvx ruff check spec/runner
          uvx ruff format --check spec/runner
      - name: Test
        run: uv run --no-project --with pytest --with 'jsonschema>=4.23' pytest -q spec/runner/tests

  linux-core:
    name: Linux core (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --directory linux/core --locked
      - name: Lint
        run: |
          uv run --directory linux/core ruff check
          uv run --directory linux/core ruff format --check
      - name: Import rules
        run: uv run --directory linux/core lint-imports
      - name: Unit tests
        run: uv run --directory linux/core pytest -q
      - name: Conformance
        run: uv run spec/runner/conformance.py --pending linux/core/conformance-pending.txt -- linux/core/.venv/bin/silentdesk

  linux-gtk:
    name: Linux app (GTK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install GTK, libadwaita and PyGObject
        run: |
          sudo apt-get update
          sudo apt-get install -y gir1.2-adw-1 gir1.2-gtk-4.0 python3-gi xvfb
      - name: Create the environment on the system Python
        run: |
          uv venv --directory linux/gtk --python /usr/bin/python3 --system-site-packages
          uv sync --directory linux/gtk --locked
      - name: Lint
        run: |
          uv run --directory linux/gtk ruff check
          uv run --directory linux/gtk ruff format --check
      - name: Tests
        run: xvfb-run -a uv run --directory linux/gtk pytest -q

  apple-core:
    name: Apple core (Swift, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux keeps the core portable; macOS is the platform it ships on.
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: swift --version
      - run: swift build --package-path apple/core
      - name: Unit tests
        run: swift test --package-path apple/core
      - name: Conformance
        run: uv run spec/runner/conformance.py --pending apple/core/conformance-pending.txt -- apple/core/.build/debug/silentdesk

  security-review:
    name: Claude security review
    needs: [spec, linux-core, linux-gtk, apple-core]
    # Pull requests from forks get no secrets, and Claude trusts the code it reads.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # v1.0.262
      - uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for security vulnerabilities only.
            Read the diff with `gh pr diff`, and read the surrounding code to judge each change in context.
            Report only issues with a concrete way to exploit them, at high or medium confidence.
            Skip style, performance, tests and denial of service.

            Post each finding as an inline comment on its line, with its severity, the exploit and a fix.
            Start each inline comment with "**Claude Code Security Review**" on its own line.
            Then post one summary comment with `gh pr comment`, saying "No security issues found" when there are none.
            The summary starts with the heading "## Claude Code Security Review".
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
